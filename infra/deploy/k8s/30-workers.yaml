apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2v-worker-media
  namespace: s2v-studio
  labels:
    app.kubernetes.io/name: s2v-studio
    app.kubernetes.io/component: worker
    app.kubernetes.io/queue: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s2v-studio
      app.kubernetes.io/component: worker
      app.kubernetes.io/queue: media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s2v-studio
        app.kubernetes.io/component: worker
        app.kubernetes.io/queue: media
    spec:
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example.com/s2v/studio:0.9.0 # CHANGE ME
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "apps.worker.background_jobs"]
          envFrom:
            - configMapRef:
                name: s2v-config
            - secretRef:
                name: s2v-secrets
          env:
            - name: WORKER_ROLE
              value: media
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
          resources:
            # ffmpeg is the CPU-bound step of this stack, so this is the limit
            # worth tuning against the node rather than copying.
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: s2v-storage
        - name: tmp
          emptyDir: {}
---
